[project]
name = "professional-profile-analyser"
version = "0.3.0"
description = "FitScore — avaliação de fit candidato × vaga (repo técnico: professional-profile-analyser)."
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.112",
  "uvicorn[standard]>=0.30",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "pypdf>=5.0",
  "markdown>=3.5",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "numpy>=1.26",
  "tenacity>=8.2",
  "pyyaml>=6.0",
  "playwright>=1.45",
  "python-dotenv>=1.0",
]

[tool.uv]
package = false

[tool.setuptools.packages.find]
include = ["app*"]
