<!doctype html>
<html lang="pt-BR" data-theme="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title or "FitScore" }}</title>
    <script>
      (function () {
        var KEY = "fitscore-theme";
        function readTheme() {
          try {
            var stored = localStorage.getItem(KEY);
            if (stored === "dark" || stored === "light") return stored;
          } catch (e) {}
          return "light";
        }
        function applyTheme(theme) {
          var next = theme === "dark" ? "dark" : "light";
          document.documentElement.setAttribute("data-theme", next);
          try { localStorage.setItem(KEY, next); } catch (e) {}
          var toggle = document.getElementById("theme-toggle");
          if (toggle) {
            var isDark = next === "dark";
            toggle.setAttribute("aria-pressed", isDark ? "true" : "false");
            toggle.setAttribute("aria-label", isDark ? "Ativar tema claro" : "Ativar tema escuro");
            var label = toggle.querySelector(".theme-toggle-label");
            if (label) label.textContent = isDark ? "Claro" : "Escuro";
          }
          return next;
        }
        window.__fitscoreTheme = { key: KEY, read: readTheme, apply: applyTheme, toggle: function () {
          return applyTheme(document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark");
        }};
        applyTheme(readTheme());
        document.addEventListener("DOMContentLoaded", function () { applyTheme(readTheme()); });
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,700;1,9..40,400&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/styles.css?v=fitscore-2">
    <link rel="icon" href="/static/brand/fitscore-mark.svg" type="image/svg+xml">
  </head>
  <body>
    <header>
      <a class="brand" href="/">
        <svg class="brand-mark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" aria-hidden="true">
          <path fill="currentColor" d="M22 12h28a3 3 0 0 1 0 6H28v10h18a3 3 0 0 1 0 6H28v20a3 3 0 0 1-6 0V15a3 3 0 0 1 3-3z"/>
          <path stroke="currentColor" stroke-width="5" stroke-linecap="round" d="M18 52c-6-6-8-14-6-22 2-9 9-16 18-18"/>
          <circle cx="30" cy="12" r="3.5" fill="currentColor"/>
        </svg>
        <span class="brand-name">FitScore</span>
      </a>
      <div class="header-end">
        <nav>
          <a href="/jobs">Vagas</a>
          <a href="/candidates">Currículos</a>
          <a href="/scores">Scores</a>
          <a href="/compensation">Remuneração</a>
          <a href="/external-apis">APIs Externas</a>
          <a href="/settings">Parâmetros</a>
        </nav>
        <button
          type="button"
          class="theme-toggle"
          id="theme-toggle"
          aria-label="Ativar tema escuro"
          aria-pressed="false"
          title="Alternar tema claro / escuro"
          onclick="window.__fitscoreTheme && window.__fitscoreTheme.toggle(); return false;"
        >
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
          </svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <path d="M21 14.5A8.5 8.5 0 1 1 9.5 3a7 7 0 0 0 11.5 11.5z"></path>
          </svg>
          <span class="theme-toggle-label">Escuro</span>
        </button>
      </div>
    </header>
    <main>
      {% block content %}{% endblock %}
    </main>

    <div id="progress-overlay" class="progress-overlay" hidden aria-hidden="true">
      <section id="status-panel" class="panel status-card" aria-live="polite">
        <div class="status-heading">
          <div>
            <p class="eyebrow">Status</p>
            <h2 id="status-label">Aguardando</h2>
          </div>
          <span id="progress-label">0%</span>
        </div>
        <div class="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div id="progress-bar"></div>
        </div>
        <p id="status-message">Iniciando…</p>
      </section>
    </div>

    <script src="/static/app.js?v=fitscore-2" defer></script>
    {% block scripts %}{% endblock %}
  </body>
</html>
