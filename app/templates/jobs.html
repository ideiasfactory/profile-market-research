{% extends "base.html" %}
{% block content %}
<div class="title-row">
  <h1>Vagas</h1>
  <a class="button" href="/jobs/new">Nova vaga</a>
</div>
<div class="list">
  {% for job in jobs %}
  <div class="list-item job-list-item">
    <a href="/jobs/{{ job.id }}">
      <strong>{{ job.title }}</strong>
      <span>{{ job.profile }} · {{ job.seniority }} · {{ job.work_location }}{% if job.cloned_from %} · clonada{% endif %}</span>
    </a>
    <form method="post" action="/jobs/{{ job.id }}/clone" class="inline-form">
      <button type="submit" class="button secondary">Clonar</button>
    </form>
  </div>
  {% else %}
  <p>Nenhuma vaga cadastrada.</p>
  {% endfor %}
</div>
{% endblock %}
